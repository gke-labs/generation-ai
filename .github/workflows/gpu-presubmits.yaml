name: GPU Presubmits

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-vxpu-gpu:
    name: test-vxpu-gpu
    runs-on: vxpu-gpu-l4
    if: >-
      vars.GPU_RUNNER_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["codebot-robot", "justinsb"]'), github.event.pull_request.user.login)
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run test-vxpu-gpu
        run: ./dev/ci/gpu/test-vxpu-gpu
