name: GPU Presubmits

on:
  push:
    branches:
      - main
    paths:
      - 'vxpu/python/**'
      - 'vxpu/proto/**'
      - 'vxpu/go.mod'
      - 'vxpu/go.sum'
      - 'vxpu/pkg/agent/**'
      - 'vxpu/pkg/api/**'
      - 'vxpu/pkg/capacity/**'
      - 'vxpu/pkg/collections/**'
      - 'vxpu/pkg/fileutil/**'
      - 'vxpu/pkg/kernelplan/**'
      - 'vxpu/pkg/machines/**'
      - 'vxpu/pkg/planner/**'
      - 'vxpu/pkg/router/**'
      - 'vxpu/pkg/stepplan/**'
      - 'vxpu/pkg/weightdisk/**'
      - 'vxpu/pkg/weightstore/**'
      - 'vxpu/cmd/vxpu/**'
      - 'vxpu/cmd/vxpu-agent/**'
      - 'vxpu/cmd/vxpu-router/**'
      - 'vxpu/images/executor/**'
      - 'vxpu/tests/e2e/hero_test.py'
      - 'vxpu/third_party/**'
      - 'modelstore/**'
      - 'dev/ci/gpu/**'
      - 'dev/ci/test_runner.py'
      - '.github/workflows/gpu-presubmits.yaml'
  pull_request:
    paths:
      - 'vxpu/python/**'
      - 'vxpu/proto/**'
      - 'vxpu/go.mod'
      - 'vxpu/go.sum'
      - 'vxpu/pkg/agent/**'
      - 'vxpu/pkg/api/**'
      - 'vxpu/pkg/capacity/**'
      - 'vxpu/pkg/collections/**'
      - 'vxpu/pkg/fileutil/**'
      - 'vxpu/pkg/kernelplan/**'
      - 'vxpu/pkg/machines/**'
      - 'vxpu/pkg/planner/**'
      - 'vxpu/pkg/router/**'
      - 'vxpu/pkg/stepplan/**'
      - 'vxpu/pkg/weightdisk/**'
      - 'vxpu/pkg/weightstore/**'
      - 'vxpu/cmd/vxpu/**'
      - 'vxpu/cmd/vxpu-agent/**'
      - 'vxpu/cmd/vxpu-router/**'
      - 'vxpu/images/executor/**'
      - 'vxpu/tests/e2e/hero_test.py'
      - 'vxpu/third_party/**'
      - 'modelstore/**'
      - 'dev/ci/gpu/**'
      - 'dev/ci/test_runner.py'
      - '.github/workflows/gpu-presubmits.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-vxpu-gpu:
    name: test-vxpu-gpu
    runs-on: vxpu-gpu-l4
    if: >-
      true &&
      (github.event_name == 'push' ||
       (contains(fromJSON('["codebot-robot", "justinsb"]'), github.event.pull_request.user.login) &&
        (github.event.pull_request.head.repo.full_name == github.repository ||
         github.event.pull_request.head.repo.owner.login == github.event.pull_request.user.login)))
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: .cache
          key: vxpu-gpu-${{ runner.os }}-${{ hashFiles('vxpu/images/executor/Dockerfile', 'vxpu/python/pyproject.toml', 'dev/ci/gpu/test-vxpu-gpu') }}

      - name: Run test-vxpu-gpu
        run: ./dev/ci/gpu/test-vxpu-gpu

      - name: Save cached dependencies
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: .cache
          key: vxpu-gpu-${{ runner.os }}-${{ hashFiles('vxpu/images/executor/Dockerfile', 'vxpu/python/pyproject.toml', 'dev/ci/gpu/test-vxpu-gpu') }}
