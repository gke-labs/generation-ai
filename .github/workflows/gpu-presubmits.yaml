name: GPU Presubmits

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-vxpu-gpu:
    name: test-vxpu-gpu
    runs-on: vxpu-gpu-l4
    if: >-
      true &&
      (github.event_name == 'push' ||
       (contains(fromJSON('["codebot-robot", "justinsb"]'), github.event.pull_request.user.login) &&
        (github.event.pull_request.head.repo.full_name == github.repository ||
         github.event.pull_request.head.repo.owner.login == github.event.pull_request.user.login)))
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Restore cached dependencies
        id: cache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # ratchet:actions/cache@v4.2.2
        with:
          path: .cache
          key: vxpu-gpu-${{ runner.os }}-${{ hashFiles('vxpu/images/executor/Dockerfile', 'vxpu/python/pyproject.toml', 'dev/ci/gpu/test-vxpu-gpu') }}

      - name: Run test-vxpu-gpu
        run: ./dev/ci/gpu/test-vxpu-gpu

      - name: Save cached dependencies
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # ratchet:actions/cache@v4.2.2
        with:
          path: .cache
          key: vxpu-gpu-${{ runner.os }}-${{ hashFiles('vxpu/images/executor/Dockerfile', 'vxpu/python/pyproject.toml', 'dev/ci/gpu/test-vxpu-gpu') }}
