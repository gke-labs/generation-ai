version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2

  - package-ecosystem: "gomod"
    directories:
      - "/experiments/finetuning"
      - "/experiments/inference-test"
      - "/experiments/scalingpolicy"
      - "/modelstore"
      - "/vxpu"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
    groups:
      gomod:
        applies-to: version-updates
        patterns:
          - "*"
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/experiments/finetuning/images/finetuning-client"
      - "/experiments/finetuning/images/finetuning-server"
      - "/experiments/inference-test/images/inference-test"
      - "/experiments/inference-test/mlx/images/mlx-inference-cpu"
      - "/experiments/inference-test/mlx/images/mlx-inference-cuda"
      - "/experiments/scalingpolicy/images/scalingpolicy-controller"
      - "/experiments/scalingpolicy/images/test-memcache-client"
      - "/experiments/scalingpolicy/images/test-memcache-server"
      - "/github-actions-runner"
      - "/modelstore/images/modelstore"
      - "/vxpu/images/router"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
        group-by: dependency-name
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  # These images install torch and pin their Python minor version to match the
  # torch build. Dependabot ignores major and minor updates to the python base
  # image here so maintainers bump Python by hand together with torch.
  # Dependabot still proposes patch and security updates within the same Python
  # minor version.
  - package-ecosystem: "docker"
    directories:
      - "/vxpu/images/executor"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
        group-by: dependency-name
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
