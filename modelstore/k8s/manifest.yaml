apiVersion: v1
kind: Namespace
metadata:
  name: modelstore
---
# The store's identity: granted roles/storage.objectAdmin on the bucket
# through workload identity (see README). It needs nothing from the
# Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelstore
  namespace: modelstore
---
apiVersion: v1
kind: Service
metadata:
  name: modelstore
  namespace: modelstore
spec:
  selector:
    app: modelstore
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
# The server. Blobs, manifests and tags live in a GCS bucket
# (--blob-store), so the pod has no volume and can be replaced freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelstore
  namespace: modelstore
spec:
  replicas: 1
  # Upload sessions and import progress live in the process: never run
  # two servers behind the Service during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: modelstore
  template:
    metadata:
      labels:
        app: modelstore
    spec:
      serviceAccountName: modelstore
      containers:
        - name: modelstore
          image: modelstore:latest
          args:
            - serve
            - --port=8080
            # BUCKET is substituted at deploy time (see README); the server
            # refuses to start if the bucket is not reachable.
            - --blob-store=gs://BUCKET
            # Optional: a Google service account for signing direct GCS URLs
            # (see README).
            # - --signer-service-account=GSA@PROJECT.iam.gserviceaccount.com
          # Optional: a Hub token for gated repositories.
          # env:
          #   - name: HF_TOKEN
          #     valueFrom:
          #       secretKeyRef: {name: hf-token, key: token}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /v2/, port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {memory: 4Gi}
