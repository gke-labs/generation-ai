# vXPU router: a ServiceAccount allowed to manage executor pods, the
# router pod itself, and a Service so in-cluster clients (e.g. a
# notebook pod) can reach it at vxpu-router:50051.
# Placeholders (IMAGE, NAME, EXECUTOR_IMAGE, ACCELERATOR) are substituted at apply time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vxpu-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vxpu-router
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vxpu-router
subjects:
  - kind: ServiceAccount
    name: vxpu-router
roleRef:
  kind: Role
  name: vxpu-router
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: "NAME"
spec:
  selector:
    app: vxpu-router
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: Pod
metadata:
  name: "NAME"
  labels:
    app: vxpu-router
spec:
  serviceAccountName: vxpu-router
  volumes:
    - name: cache-volume
      emptyDir:
        sizeLimit: 80Gi
  containers:
    - name: router
      image: "IMAGE"
      ports:
        - containerPort: 50051
        - containerPort: 8080
      readinessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 3
        periodSeconds: 2
      volumeMounts:
        - name: cache-volume
          mountPath: /tmp/vxpu-cache
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
          ephemeral-storage: "60Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "80Gi"
      env:
        - name: VXPU_EXECUTOR_IMAGE
          value: "EXECUTOR_IMAGE"
        - name: VXPU_ACCELERATOR
          value: "ACCELERATOR"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
  restartPolicy: Never
