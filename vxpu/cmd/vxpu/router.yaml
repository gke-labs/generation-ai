# vXPU router: a ServiceAccount allowed to manage executor pods, a
# zero-RBAC vxpu-agent ServiceAccount for executor pods, the router pod
# itself, and a Service so in-cluster clients (e.g. a notebook pod) can
# reach it at vxpu-router:50051. Every object carries
# app.kubernetes.io/part-of: vxpu-router so `vxpu down` can remove them.
# Placeholders (IMAGE, NAME, EXECUTOR_IMAGE, ACCELERATOR, MODELSTORE) are substituted at apply time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vxpu-router
  labels:
    app.kubernetes.io/part-of: vxpu-router
---
# Zero-RBAC ServiceAccount for executor pods matching the pod agent SPIFFE identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vxpu-agent
  labels:
    app.kubernetes.io/part-of: vxpu-router
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vxpu-router
  labels:
    app.kubernetes.io/part-of: vxpu-router
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  # compile jobs for models registered by name, and their logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vxpu-router
  labels:
    app.kubernetes.io/part-of: vxpu-router
subjects:
  - kind: ServiceAccount
    name: vxpu-router
roleRef:
  kind: Role
  name: vxpu-router
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: "NAME"
  labels:
    app.kubernetes.io/part-of: vxpu-router
spec:
  selector:
    vxpu.gke-labs.dev/router: "NAME"
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: Pod
metadata:
  name: "NAME"
  labels:
    app: vxpu-router
    app.kubernetes.io/part-of: vxpu-router
    vxpu.gke-labs.dev/router: "NAME"
spec:
  serviceAccountName: vxpu-router
  volumes:
    - name: cache-volume
      emptyDir:
        sizeLimit: 600Gi
    - name: vxpu-tls
      projected:
        sources:
          - configMap:
              name: vxpu-ca-bundle
              items:
                - key: ca.crt
                  path: ca.crt
          - secret:
              name: vxpu-coordinator-tls
              items:
                - key: tls.crt
                  path: tls.crt
                  mode: 0400
                - key: tls.key
                  path: tls.key
                  mode: 0400
  containers:
    - name: router
      image: "IMAGE"
      args:
        - "--admin-port=50052"
        - "--tls-dir=/var/run/vxpu/tls"
      ports:
        - containerPort: 50051
        - containerPort: 8080
        - containerPort: 8081
        - containerPort: 50052
      readinessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 3
        periodSeconds: 2
      volumeMounts:
        - name: cache-volume
          mountPath: /tmp/vxpu-cache
        - name: vxpu-tls
          mountPath: /var/run/vxpu/tls
          readOnly: true
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
          ephemeral-storage: "60Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "600Gi"
      env:
        - name: VXPU_EXECUTOR_IMAGE
          value: "EXECUTOR_IMAGE"
        - name: VXPU_ACCELERATOR
          value: "ACCELERATOR"
        - name: VXPU_MODELSTORE_URL
          value: "MODELSTORE"
        - name: VXPU_EXTERNAL_EXECUTORS
          value: "EXTERNAL_EXECUTORS"
        - name: VXPU_MODELSTORE_EXTERNAL_URL
          value: "MODELSTORE_EXTERNAL_URL"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
  restartPolicy: Never
