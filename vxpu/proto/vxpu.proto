syntax = "proto3";

package vxpu;

option go_package = "github.com/gke-labs/generation-ai/vxpu/pkg/api/v1alpha1;v1alpha1";

// Engine is the client-facing service for vXPU. Clients (the vxpu CLI,
// Python client, and transformers AutoModel facade) call Engine on the
// router for session management, chat, generation, and model metadata.
// It is stable, versioned with care, and carries no engine internals.
service Engine {
  // LoadModel ships the artifact. Idempotent: the artifact's content
  // digest identifies the model, and a matching digest reuses the
  // already-loaded engine.
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse) {}
  // RegisterModel makes a model servable by name: the router imports
  // the weights into modelstore and compiles the model for its executor
  // image (a compile job exporting the artifact into modelstore), unless
  // that was done before. Blocks until the model is registered;
  // idempotent.
  rpc RegisterModel(RegisterModelRequest) returns (RegisterModelResponse) {}
  // NewSession allocates fresh per-session state (KV cache). With a
  // model name, the router loads that registered model if needed; while
  // it loads, NewSession fails with FAILED_PRECONDITION and the caller
  // retries.
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse) {}
  // Chat runs one conversation turn in a session. Multi-turn reuses
  // the session's cache: only new suffix tokens are prefilled.
  rpc Chat(ChatRequest) returns (ChatResponse) {}
  // Generate is transformers' generate() over the wire: the client
  // owns the tokenizer and sends the full prompt as token ids; the
  // router forwards the call to an executor, which runs the same torch
  // loop (prefill, decode, HF-style sampling) in the session and
  // streams back the new ids. The session's cache is reused for
  // whatever prefix matches.
  rpc Generate(GenerateRequest) returns (stream GenerateResponse) {}
  // GetModelStats summarises what the engine recorded about a model
  // served by name: every request's statistics, and the execution
  // telemetry of the requests it sampled (kept in modelstore, so they
  // outlive the router).
  rpc GetModelStats(GetModelStatsRequest) returns (GetModelStatsResponse) {}
  // ExplainModel returns the plan the coordinator chose for a model's
  // last load by name, and why (#394).
  rpc ExplainModel(ExplainModelRequest) returns (ExplainModelResponse) {}
}

// Executor is the internal router-to-executor service. The router (and
// later the planner or coordinator) calls Executor on executor pods for
// model loading, execution, telemetry, node serving, and plan inspection.
// It can change freely with the router and executors, which ship together.
//
// Executor runs models shipped as vXPU artifacts: a content-addressed
// manifest (architecture config + weight references), weightless exported
// graphs, and a binding classifying every graph tensor as bound (weight
// reference), derived (computed from config), or state (session-owned,
// zero-initialized).
//
// The executor never receives weights over this API: it rehydrates them
// from the manifest's content-addressed references.
service Executor {
  // LoadModel ships the artifact. Idempotent: the artifact's content
  // digest identifies the model, and a matching digest reuses the
  // already-loaded engine.
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse) {}
  // NewSession allocates fresh per-session state (KV cache).
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse) {}
  // ExecuteChat runs one conversation turn in a session, returning
  // execution telemetry when requested. Multi-turn reuses the session's
  // cache: only new suffix tokens are prefilled.
  rpc ExecuteChat(ExecuteChatRequest) returns (ExecuteChatResponse) {}
  // Execute runs transformers' generate() loop on the executor,
  // optionally returning execution telemetry on the final message. The
  // executor runs the torch loop (prefill, decode, HF-style sampling) in
  // the session and streams back the new ids. The session's cache is
  // reused for whatever prefix matches.
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse) {}
  // Describe reports what the executor runs on: its probe of the machine,
  // for the coordinator's machine database (#394). Answers with or
  // without a model loaded.
  rpc Describe(DescribeRequest) returns (DescribeResponse) {}
  // DescribeNodes describes an artifact's decode step as a dataflow graph:
  // its nodes in call order, and for a host node what it reads and how
  // many bytes that is (#394). The coordinator places nodes from it.
  rpc DescribeNodes(DescribeNodesRequest) returns (DescribeNodesResponse) {}
  // ServeNodes serves some of an artifact's decode-step nodes on a port
  // of this machine: a native node server (nodeserver.py) that answers
  // their tcp:// mailboxes. Answers once they are loaded.
  rpc ServeNodes(ServeNodesRequest) returns (ServeNodesResponse) {}
  // ServeRange serves the loaded engine's range of whole layers on a
  // port of this machine, for the engine that runs the layers before it
  // (rangeserver.py, #387). LoadModel sets the range, through the plan's
  // VXPU_LAYER_RANGE. ServeRange returns the load state in its response
  // while the engine is still loading.
  rpc ServeRange(ServeRangeRequest) returns (ServeRangeResponse) {}
  // GetLoad reports the state of a model load on this executor.
  rpc GetLoad(GetLoadRequest) returns (GetLoadResponse) {}
}

message LoadModelRequest {
  string manifest_json = 1;
  string binding_json = 2;
  bytes prefill_graph = 3;
  bytes decode_graph = 4;
  // The plan the coordinator chose for this load: switches by name
  // (VXPU_GPU_EXPERTS, VXPU_EXPERT_MAILBOXES, ...) with the values the
  // environment would hold, read ahead of the environment (#394).
  map<string, string> plan = 5;
}

message LoadModelResponse {
  bool success = 1;
}

message RegisterModelRequest {
  // A Hugging Face repository id, e.g. "deepseek-ai/DeepSeek-V4.1-Flash".
  string model = 1;
  // Branch, tag or commit; empty means "main".
  string revision = 2;
  // Switches the coordinator sets whenever it loads this model (see
  // LoadModelRequest.plan). Replaces the model's previous plan; empty
  // leaves it as it is.
  map<string, string> plan = 3;
}

message RegisterModelResponse {
  string model = 1;
  string revision = 2;
  // The commit the revision resolved to.
  string commit = 3;
  // The compiled artifact in modelstore, as repository:tag.
  string artifact = 4;
  // True when this call compiled the model; false when a compiled
  // artifact for this commit and executor image already existed.
  bool compiled = 5;
  // Bytes of weights the artifact references.
  int64 weight_bytes = 6;
}

message NewSessionRequest {
  // A registered model to open the session on; empty means the model
  // this connection last loaded with LoadModel.
  string model = 1;
  // The model's revision; empty means "main".
  string revision = 2;
}

message NewSessionResponse {
  string session_id = 1;
}

// What execution telemetry an executor records for a call.
enum Telemetry {
  TELEMETRY_NONE = 0;
  // Segment and host-op timings, expert counts, and the plan.
  TELEMETRY_SUMMARY = 1;
  // The summary, plus each decode step's expert selections in order.
  TELEMETRY_TRACE = 2;
}

message ChatRequest {
  string session_id = 1;
  string text = 2;
  int32 max_new_tokens = 3;
  // raw_prompt means text is a complete, already-templated prompt
  // (the client applied the chat template — e.g. with tools — and
  // owns the conversation). The executor tokenizes it verbatim
  // instead of wrapping it as a user turn. For multi-turn use, send
  // the full rendered conversation each turn: the executor prefills
  // from the first token that differs from the session's cache.
  bool raw_prompt = 4;
}

message ChatResponse {
  string text = 1;
  int32 session_tokens = 2;
  int32 new_prompt_tokens = 3;
  int32 generated = 4;
  float prefill_ms = 5;
  float ms_per_token = 6;
}

// ExecuteChatRequest is the internal chat request passed to executors.
message ExecuteChatRequest {
  ChatRequest request = 1;
  // What execution telemetry this turn records.
  Telemetry telemetry = 2;
}

// ExecuteChatResponse is the internal chat response from executors.
message ExecuteChatResponse {
  ChatResponse response = 1;
  // When the request set telemetry: the execution telemetry as JSON
  // (format "vxpu-telemetry/1").
  string telemetry_json = 2;
}

// GenerateRequest mirrors the generation parameters of
// transformers.GenerationConfig. Unset optional fields fall back to
// the model's own generation_config.json on the executor, so a bare
// request behaves like model.generate(input_ids) would.
message GenerateRequest {
  string session_id = 1;
  // The complete prompt (batch size 1), as the tokenizer produced it.
  repeated int32 input_ids = 2;
  // Unset means transformers' default (max_length 20); 0 is a valid
  // request for no new tokens.
  optional int32 max_new_tokens = 3;
  optional bool do_sample = 4;
  optional float temperature = 5;
  optional int32 top_k = 6;
  optional float top_p = 7;
  optional float repetition_penalty = 8;
  // Additional ids that end generation, on top of the model's own.
  repeated int32 eos_token_id = 9;
  // Seed for the executor's sampler; unset means unseeded.
  optional uint64 seed = 10;
}

// GenerateResponse streams newly generated ids as they are produced.
// The final message has done=true and carries the statistics.
message GenerateResponse {
  repeated int32 token_ids = 1;
  bool done = 2;
  // "eos", "length", or "" while streaming.
  string finish_reason = 3;
  int32 prompt_tokens = 4;
  // How many prompt tokens were actually prefilled (the rest were
  // already in the session's cache).
  int32 prefilled_tokens = 5;
  int32 generated = 6;
  float prefill_ms = 7;
  float ms_per_token = 8;
}

// ExecuteRequest is the internal execution request passed to executors.
message ExecuteRequest {
  GenerateRequest request = 1;
  // What execution telemetry this call records (segment and host-op
  // timings, expert selections, the plan; JSON in
  // ExecuteResponse.telemetry_json on the final message). For tuning
  // execution plans; nothing is recorded with TELEMETRY_NONE.
  Telemetry telemetry = 2;
}

// ExecuteResponse streams newly generated ids as they are produced by
// the executor. The final message has done=true and carries the statistics
// and optional internal telemetry.
message ExecuteResponse {
  GenerateResponse response = 1;
  // On the final message when the request set telemetry: the executor's
  // execution telemetry as JSON (format "vxpu-telemetry/1").
  string telemetry_json = 2;
}

message GetModelStatsRequest {
  // A model served by name (see RegisterModel).
  string model = 1;
  // Also return every stored record, as JSON lines.
  bool records = 2;
}

message GetModelStatsResponse {
  // The summary as JSON (format "vxpu-model-stats/1").
  string summary_json = 1;
  // With records set: one JSON object per line ("vxpu-request/1").
  string records_jsonl = 2;
}

message DescribeRequest {}

message DescribeResponse {
  // The executor's probe of its machine, as JSON: device, cpu,
  // cpu_threads, simd, ram_bytes, and with a GPU gpu, gpu_memory_bytes,
  // gpu_count (vxpu/pkg/machines.Probe).
  string hardware_json = 1;
}

message ExplainModelRequest {
  string model = 1;
}

message ExplainModelResponse {
  // {model, machine, time, switches (sent), hints (the registered plan's,
  // which win), reasons}, as JSON.
  string plan_json = 1;
}

message DescribeNodesRequest {
  string manifest_json = 1;
  string binding_json = 2;
  bytes decode_graph = 3;
  // If set, the response also says where the step can be cut into ranges of
  // whole layers. A cut must be legal in both the decode and prefill graphs.
  bytes prefill_graph = 4;
}

message DescribeNodesResponse {
  // [{name, kind, layers, and for a host node collection, index,
  // resident_bytes}], as JSON.
  string nodes_json = 1;
  // Where the step can be cut into ranges of whole layers (cuts.py), as
  // JSON. It's empty if the request didn't include the prefill graph.
  string cuts_json = 2;
}

message ServeNodesRequest {
  string manifest_json = 1;
  string binding_json = 2;
  bytes decode_graph = 3;
  // The nodes to serve, by name; a message's node index is its position.
  repeated string nodes = 4;
}

message ServeNodesResponse {
  // The port the nodes are served on, on the executor's own address.
  int32 port = 1;
}

message ServeRangeRequest {}

message ServeRangeResponse {
  // The port the executor serves the range on, at its own address.
  int32 port = 1;
  // The layers the range covers, as START:END. An empty END means the last
  // layer.
  string layer_range = 2;
  // The load state of the engine.
  LoadState state = 3;
}

// The state of a model load on an executor.
enum LoadState {
  LOAD_STATE_NONE = 0;
  LOAD_STATE_LOADING = 1;
  LOAD_STATE_READY = 2;
  LOAD_STATE_FAILED = 3;
}

message GetLoadRequest {}

message GetLoadResponse {
  // The load's state: NONE, LOADING, READY, or FAILED.
  LoadState state = 1;
  // The error message when state is LOAD_STATE_FAILED.
  string error = 2;
  // Bytes of weights rehydrated so far.
  int64 bytes_rehydrated = 3;
}
