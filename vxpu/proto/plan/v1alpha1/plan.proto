syntax = "proto3";

package vxpu.plan.v1alpha1;

option go_package = "github.com/gke-labs/generation-ai/vxpu/pkg/api/plan/v1alpha1;v1alpha1";

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  // compiled_in says whether this knob's value is built into a compiled package.
  // If true, the value is fixed when a package is compiled: changing it needs a
  // new package, so the value is part of the package's name.
  // If false, only code outside every compiled package uses the knob (today the
  // routed expert kernels and the collectives): changing it needs no new package,
  // and it does not affect any package's name.
  optional bool compiled_in = 50001;
}

// KernelTable defines the physical execution choices (implementation body per
// call site and kernel knobs) for one card. The planner writes tables; an engine
// given a table applies it exactly and measures nothing.
//
// Every entry in sites must match at least one custom operator call site of the
// model being planned. If an entry matches no call site in the model's exported
// graph (by op, site module path, or shapes), vxpu plan emit refuses the table
// with an error naming the unused entry. A table tailored for one model architecture
// or tensor shape fails rather than silently misapplying overrides to another.
message KernelTable {
  // The GPU hardware model this table targets (e.g. "NVIDIA H100 80GB HBM3").
  optional string gpu = 1;
  // The kernels' knobs in effect for this table.
  Knobs knobs = 2;
  // Per-call-site implementation body choices.
  repeated SiteEntry sites = 3;
  // Per-row-count kernel knob choices.
  repeated KnobsByRows knobs_by_rows = 4;
}

// KnobsByRows configures kernel knobs for input row counts up to rows_max.
message KnobsByRows {
  // Maximum number of input rows this entry covers (unit: rows).
  optional int32 rows_max = 1;
  // The knobs in effect for row counts up to rows_max.
  Knobs knobs = 2;
}

// SiteEntry names an implementation body for a logical op, optionally
// restricted to a specific module call site or input shapes. Every entry in a table
// must match at least one call site of the model being planned, or the planner
// refuses the table with an error naming the entry.
message SiteEntry {
  // The logical op name (e.g. "vxpu::fp8_linear", "vxpu::rotary").
  string op = 1;
  // The call site module path (e.g. "model.layers.1.engram.wkv").
  optional string site = 2;
  // Input shapes string representation (e.g. "8->16" or "128->64").
  optional string shapes = 3;
  // The registered implementation name to dispatch (e.g. "reference", "gpu-fp8-gemv").
  string impl = 4;
}

// Knobs defines the typed kernel configuration knobs for GPU and CPU execution.
// Each field corresponds to a tuning parameter controlling kernel tile sizes,
// launch modes, fusions, or communication schedules.
message Knobs {
  // Maximum number of input rows to dispatch dense linear layers to GEMV instead of GEMM (unit: rows).
  optional int32 GEMV_ROWS_MAX = 1 [(compiled_in) = true];
  // Maximum number of tokens or rows to run through the direct FP4 expert kernel path (unit: rows).
  optional int32 FP4_DIRECT_MAX = 2 [(compiled_in) = false];
  // Expert bank batch size for front-split FFN execution (unit: expert count).
  optional int32 FFN_FRONT_EB = 3 [(compiled_in) = true];
  // Batch dimension tile size for front-split FFN execution (unit: rows).
  optional int32 FFN_FRONT_BD = 4 [(compiled_in) = true];
  // Batch dimension tile size for front-split GEMM/GEMV execution (unit: rows).
  optional int32 FRONT_SPLIT_BD = 5 [(compiled_in) = true];
  // Expert batch tile size for front-split execution (unit: expert count).
  optional int32 FRONT_SPLIT_EB = 6 [(compiled_in) = true];
  // Reduction block tile size for front-split execution (unit: elements).
  optional int32 FRONT_SPLIT_RB = 7 [(compiled_in) = true];
  // Number of splits along the K dimension for FP4 GEMM (unit: splits).
  optional int32 FP4_KSPLIT = 8 [(compiled_in) = true];
  // Whether native FP4 hardware instructions are enabled (unit: boolean flag).
  optional bool FP4_NATIVE = 9 [(compiled_in) = true];
  // Whether the direct FP4 expert kernel path is enabled (unit: boolean flag).
  optional bool FP4_DIRECT = 10 [(compiled_in) = false];
  // Whether native GEMV bodies recode x in prologue (true) or in a launch before each (false) (unit: boolean flag).
  optional bool MXFP8_RECODE = 11 [(compiled_in) = true];
  // Direct FP4 gate/up expert kernel N-dimension tile size (unit: rows per program).
  optional int32 FP4_GU_BN = 12 [(compiled_in) = false];
  // Direct FP4 gate/up expert kernel K-dimension tile size (unit: K per iteration).
  optional int32 FP4_GU_BK = 13 [(compiled_in) = false];
  // Number of warps per thread block for the direct FP4 gate/up expert kernel (unit: warps).
  optional int32 FP4_GU_WARPS = 14 [(compiled_in) = false];
  // Number of pipeline stages for the direct FP4 gate/up expert kernel (unit: pipeline stages).
  optional int32 FP4_GU_STAGES = 15 [(compiled_in) = false];
  // Direct FP4 down expert kernel N-dimension tile size (unit: rows per program).
  optional int32 FP4_DN_BN = 16 [(compiled_in) = false];
  // Direct FP4 down expert kernel K-dimension tile size (unit: K per iteration).
  optional int32 FP4_DN_BK = 17 [(compiled_in) = false];
  // Number of warps per thread block for the direct FP4 down expert kernel (unit: warps).
  optional int32 FP4_DN_WARPS = 18 [(compiled_in) = false];
  // Number of pipeline stages for the direct FP4 down expert kernel (unit: pipeline stages).
  optional int32 FP4_DN_STAGES = 19 [(compiled_in) = false];
  // Whether window_kv row finish runs inside the GEMV last program (hero run 11) (unit: boolean flag).
  optional bool FOLD_POST = 20 [(compiled_in) = true];
  // Number of rows finished at a time when FOLD_POST is active (unit: rows).
  optional int32 FOLD_POST_RB = 21 [(compiled_in) = true];
  // Whether the direct expert path runs as a single launch per layer (hero run 12) (unit: boolean flag).
  optional bool FP4_ONE_LAUNCH = 22 [(compiled_in) = false];
  // Number of thread blocks (programs) scheduled per SM in the single-launch expert path (unit: programs per SM).
  optional int32 FP4_ONE_PER_SM = 23 [(compiled_in) = false];
  // Number of warps per thread block for the single-launch expert path (unit: warps).
  optional int32 FP4_ONE_WARPS = 24 [(compiled_in) = false];
  // Number of pipeline stages for the single-launch expert path (unit: pipeline stages).
  optional int32 FP4_ONE_STAGES = 25 [(compiled_in) = false];
  // Programmatic dependent launch mode for two-launch down kernel: 0 off, 1 whole-grid wait, 2 per-pair counters (unit: mode enum).
  optional int32 FP4_PDL = 26 [(compiled_in) = false];
  // Whether every kernel in the compiled step uses programmatic dependent launch (hero run 16) (unit: boolean flag).
  optional bool PDL_ALL = 27 [(compiled_in) = true];
  // Whether to use a compact grid under expert parallelism (hero run 15) (unit: boolean flag).
  optional bool FP4_DIRECT_COMPACT = 28 [(compiled_in) = false];
  // Whether held pairs are grouped in dispatch order under expert parallelism (unit: boolean flag).
  optional bool FP4_DIRECT_GROUP = 29 [(compiled_in) = false];
  // Whether held pairs dispatch first with unheld pairs' empty programs last (unit: boolean flag).
  optional bool FP4_DIRECT_FIRST = 30 [(compiled_in) = false];
  // Minimum number of rows required to run shared FFN as GEMM rather than GEMV (unit: rows).
  optional int32 SHARED_FFN_GEMM_MIN_ROWS = 31 [(compiled_in) = true];
  // Number of K splits for direct FP4 gate/up expert kernels (hero run 15) (unit: splits).
  optional int32 FP4_GU_KS = 32 [(compiled_in) = false];
  // Number of K splits (over I) for direct FP4 down expert kernels (hero run 15) (unit: splits).
  optional int32 FP4_DN_KS = 33 [(compiled_in) = false];
  // Minimum number of expert pairs per layer to switch from direct to descriptor-fed grouped GEMM (hero run 15) (unit: pairs per layer).
  optional int32 FP4_GEMM_MIN_PAIRS = 34 [(compiled_in) = false];
  // Grouped FP4 gate/up expert GEMM M-dimension tile size (unit: pairs per block).
  optional int32 FP4_GG_BM = 35 [(compiled_in) = false];
  // Grouped FP4 gate/up expert GEMM N-dimension tile size (unit: expert rows per program).
  optional int32 FP4_GG_BN = 36 [(compiled_in) = false];
  // Grouped FP4 gate/up expert GEMM K-dimension tile size (unit: K per step).
  optional int32 FP4_GG_BK = 37 [(compiled_in) = false];
  // Number of warps per thread block for grouped FP4 gate/up expert GEMM (unit: warps).
  optional int32 FP4_GG_WARPS = 38 [(compiled_in) = false];
  // Number of pipeline stages for grouped FP4 gate/up expert GEMM (unit: pipeline stages).
  optional int32 FP4_GG_STAGES = 39 [(compiled_in) = false];
  // Grouped FP4 down expert GEMM M-dimension tile size (unit: pairs per block).
  optional int32 FP4_GD_BM = 40 [(compiled_in) = false];
  // Grouped FP4 down expert GEMM N-dimension tile size (unit: expert rows per program).
  optional int32 FP4_GD_BN = 41 [(compiled_in) = false];
  // Grouped FP4 down expert GEMM K-dimension tile size (unit: K per step).
  optional int32 FP4_GD_BK = 42 [(compiled_in) = false];
  // Number of warps per thread block for grouped FP4 down expert GEMM (unit: warps).
  optional int32 FP4_GD_WARPS = 43 [(compiled_in) = false];
  // Number of pipeline stages for grouped FP4 down expert GEMM (unit: pipeline stages).
  optional int32 FP4_GD_STAGES = 44 [(compiled_in) = false];
  // Grouped expert GEMM fusions bitmask: 1 schedule slots lookup, 2 SwiGLU/quant, 4 token sum, 8 dependent launch (unit: bitmask bits).
  optional int32 FP4_FUSE_EPI = 45 [(compiled_in) = false];
  // Whether reduce-scatter form is forced for vxpu::allreduce (hero run 14) (unit: boolean flag).
  optional bool ALLREDUCE_SCATTER = 46 [(compiled_in) = false];
  // Minimum row count at which reduce-scatter allreduce is enabled (unit: rows).
  optional int32 ALLREDUCE_SCATTER_MIN_ROWS = 47 [(compiled_in) = false];
  // Whether allreduce pushes partials in BF16 (unit: boolean flag).
  optional bool ALLREDUCE_PUSH_BF16 = 48 [(compiled_in) = false];
  // Whether allreduce pull communication mode is enabled (unit: boolean flag).
  optional bool ALLREDUCE_PULL = 49 [(compiled_in) = false];
  // Whether draft model allreduce pull communication mode is enabled (unit: boolean flag).
  optional bool DRAFT_ALLREDUCE_PULL = 50 [(compiled_in) = false];
  // Thread block size for allreduce program execution (unit: elements per program).
  optional int32 ALLREDUCE_BLOCK = 51 [(compiled_in) = false];
  // Whether tensor-parallel partials are rounded to BF16 before summing ranks (hero run 15) (unit: boolean flag).
  optional bool TP_PARTIALS_BF16 = 52 [(compiled_in) = true];
  // Weight rows per program for fused push GEMV (hero run 15) (unit: rows per program).
  optional int32 GEMV_PUSH_BN = 53 [(compiled_in) = false];
}

// The execution kind of a call site. It names the physical operator family the
// planner chooses an implementation from; it is not the kernel.
enum SiteKind {
  // Unspecified execution site kind.
  SITE_KIND_UNSPECIFIED = 0;
  // Dense matrix-vector product operator family for linear projections.
  SITE_KIND_DENSE_GEMV = 1;
  // Mixture of experts feed-forward network operator family.
  SITE_KIND_EXPERT_OP = 2;
  // Residual accumulation or reduction operator family.
  SITE_KIND_SUM_SITE = 3;
  // Multi-head or latent attention operator family.
  SITE_KIND_ATTENTION = 4;
  // Speculative drafting head or engram operator family.
  SITE_KIND_DRAFTER = 5;
}

// SiteExecutionStats records execution measurements for a single call site.
// In database terms, this is the EXPLAIN ANALYZE actuals for an individual site.
message SiteExecutionStats {
  // Measured execution latency for one call to this site, as a median across the recorded steps of the run (unit: microseconds).
  // Unset when not measured.
  optional double measured_us = 1;
}

// ExecutedBody records an operator implementation body that executed at a host op call site during decode.
// A run record covers decode program calls, matching the decode plan. The engine keeps prefill calls out.
// Multiple bodies may execute across decode steps when different query row counts take different implementations.
// The record lists each distinct body with the row counts it observed.
// When the engine executes its default runtime implementation without substitution, body is empty.
// When a host op was measured but did not execute during decode, executed_bodies is empty with measured set to true.
// Call sites that are not measured leave executed_bodies empty and measured set to false.
message ExecutedBody {
  // Body is the operator implementation body that executed at this host op call site.
  // The engine leaves this empty when it executed its default runtime implementation without substitution.
  string body = 1;

  // RowCounts lists the input row counts at which this body executed, when known.
  repeated int32 row_counts = 2;
}

// PlanSite represents a single call site in the model's computation graph.
//
// In a run record, a call site is in one of three states:
// 1. Measured and executed: measured is true (or executed_bodies is populated);
//    executed_bodies lists the implementation bodies that executed at this site
//    alongside observed row counts, or body is an empty string when the engine ran
//    its default runtime implementation without substitution.
// 2. Measured and did not run: measured is true and executed_bodies is empty.
//    The engine tracked the site during execution but did not invoke it. This counts as differing
//    from the planned body on the tree page.
// 3. Not measured: measured is false and executed_bodies is empty. The site had no
//    execution observation, such as non-host compiled or kept call sites, or a host op
//    served by a remote node. Silence in the record reads as not measured.
//    A not-measured site is neither matching nor differing; the tree page excludes it
//    from differing and counts it separately under "Call Sites Not Measured".
message PlanSite {
  // The identifier of the call site. The graph node name (e.g. "fp8_linear_7")
  // uniquely identifies a call site within an exported graph artifact. A reader
  // checks that the plan belongs to the artifact via artifact_md5 on PlanFile.
  string id = 1;
  // The execution kind naming the physical operator family.
  SiteKind kind = 2;
  // Tensor dimensions.
  repeated int32 shape = 3;
  // Candidate row counts planned for this site.
  repeated int32 row_counts = 4;
  // The strategy assigned to this site (default "default").
  string strategy = 5;
  // Execution measurements recorded when the site runs. Unset in an unexecuted plan.
  SiteExecutionStats stats = 6;
  // Body is the physical kernel implementation body chosen to execute at this site.
  // Left empty when no kernel body was chosen by the planner (e.g. for operations
  // like hc_front, ffn_front, or sparse_attn that have no plannable catalog variants);
  // the engine executes its default runtime implementation without substitution.
  string body = 7;
  // ExecutedBodies lists the operator implementation bodies that executed at this call site during a run,
  // alongside the row counts each observed. Unset in an unexecuted plan.
  repeated ExecutedBody executed_bodies = 8;

  // Measured reports whether this call site was measured during the run.
  // When false, the site had no execution observation and is reported as not measured.
  bool measured = 9;
}

// PlanFile is the physical execution plan emitted for an artifact, and the
// record of a run when its measurement fields are filled in. In database terms,
// an unexecuted plan is the EXPLAIN output: what the planner decided to do.
// Filling in stats turns it into EXPLAIN ANALYZE: the same plan tree with
// actuals recorded beside each node.
message PlanFile {
  // Checksum over manifest.json and binding.json bytes.
  string artifact_md5 = 1;
  // Git commit hash of the tree used to build the plan.
  string tree_commit = 2;
  // Call sites planned for the model across execution kinds.
  repeated PlanSite sites = 3;
  // Execution measurements recorded when the plan is run. Unset in an unexecuted plan.
  PlanExecutionStats stats = 4;
  // Knobs planned for the model, set by the planner before execution. When a
  // package is compiled, its compiled-in knobs fix its behavior and are part of
  // the package's name.
  Knobs knobs = 5;
  // Segments of the model's partitioned execution graph, filled by plan emit.
  // The executor finds a host segment's call site through this list.
  repeated Segment segments = 6;
  // PlanHash is the plan's content identity, computed once in Go.
  // It covers what the planner decided (artifact_md5, tree_commit, sites,
  // knobs), excluding all execution measurements (stats on PlanFile and on each
  // PlanSite) and any existing plan_hash. It travels with the plan so the
  // executor reports it back and the router compares it without re-hashing
  // non-canonical protobuf serialization across languages.
  string plan_hash = 10;
}

// PlanExecutionStats records execution measurements and facts known only to the
// executor from a real run, such as effective knobs, plan hash, and verification checks.
// In database terms, this is the EXPLAIN ANALYZE side of the plan file.
message PlanExecutionStats {
  // Hash of the physical execution plan file this record was filled from. Unset in a plan.
  optional string plan_hash = 1;
  // Knobs in effect during the run.
  Knobs knobs = 2;
  // Median step latency in milliseconds (unit: milliseconds).
  optional double median_step_ms = 3;
  // Generated tokens per stream per step (unit: tokens per stream per step).
  optional double tokens_a_stream_a_step = 4;
  // Number of accepted draft tokens per step (unit: tokens per step).
  optional double accepted_drafts_a_step = 5;
  // Verification checks executed and their pass/fail results.
  map<string, bool> checks = 6;
  // Peak memory allocated in bytes on each GPU card (unit: bytes).
  repeated int64 per_card_peak_memory = 7;
  // Median device time in milliseconds per stamp class over the steps of the recorded call, at most the last eight, when the in-graph stamps are on: the name of the vxpu op a dense segment calls, or the node kind of a host node.
  map<string, double> per_class_device_times = 8;
}

// GoldenPrompt describes one prompt and its expected greedy token sequence.
message GoldenPrompt {
  // Ids is the prompt's input token ids.
  repeated int32 ids = 1;
  // Tokens is the expected greedy token sequence produced for the prompt.
  repeated int32 tokens = 2;
}

// GoldenFile holds the checked-in reference tokens for a model.
message GoldenFile {
  // Format is the document format identifier (e.g. "vxpu-golden/1").
  string format = 1;
  // TokensPerPrompt is the number of tokens to generate per prompt.
  int32 tokens_per_prompt = 2;
  // Source is the provenance of the reference tokens.
  string source = 3;
  // Prompts is the sequence of prompts and their reference greedy tokens.
  repeated GoldenPrompt prompts = 4;
}

// SiteBytes records memory footprints in bytes for tensors at a call site.
message SiteBytes {
  // Weight parameters read by the site (unit: bytes).
  int64 weights = 1;
  // Input and output activations moved by the site (unit: bytes).
  int64 activations = 2;
  // State buffers used by the site (unit: bytes).
  int64 state = 3;
}

// SiteRecord records physical execution choices and byte counts for a single call site.
message SiteRecord {
  // The logical op name (e.g. "vxpu::fp8_linear") (unit: op name).
  string op = 1;
  // The call site module path (e.g. "model.layers.1.engram.wkv") (unit: module path).
  optional string site = 2;
  // Graph node identifier for this call site (unit: node name).
  string node = 3;
  // Input and output shapes string (e.g. "8->16" or "128->64") (unit: shapes string).
  optional string shapes = 4;
  // Model layer index for this call site (unit: layer index).
  optional int32 layer = 5;
  // Selected implementation body name (e.g. "reference", "gpu-fp8-gemv") (unit: implementation name).
  string chosen = 6;
  // Origin of the implementation choice (e.g. "table", "registry", "kept") (unit: source name).
  string source = 7;
  // Rationale for keeping or choosing an implementation (unit: rationale string).
  optional string why = 8;
  reserved 9;
  reserved "candidates";
  // Whether this site ran as part of a fused kernel body (unit: boolean flag).
  optional bool fused = 10;
  // Triton kernel names inlined at this site (unit: kernel names).
  repeated string kernels = 11;
  // Measured execution time in microseconds (unit: microseconds).
  optional double measured_us = 12;
  // Memory bytes transferred at this site.
  SiteBytes bytes = 13;
  // Token row count at this call site (unit: rows).
  optional int32 rows = 14;
  // Operand tensor data type at this call site (e.g. "bfloat16") (unit: dtype string).
  optional string dtype = 15;
  // Whether this site supports split sinkhorn execution (unit: boolean flag).
  optional bool sinkhorn_supported = 16;
}

// KernelCondition expresses the condition under which a kernel body applies as data.
message KernelCondition {
  // Maximum row count supported by the body (rows <= max_rows) (unit: rows).
  optional int32 max_rows = 1;
  // Exact row count required by the body (rows == exact_rows) (unit: rows).
  optional int32 exact_rows = 2;
  // Minimum row count (inclusive) required by the body (rows >= min_rows) (unit: rows).
  optional int32 min_rows = 3;
  // Tensor data type required by the body (e.g. "bfloat16") (unit: dtype string).
  optional string dtype = 4;
  // Whether the site must support split sinkhorn execution (unit: boolean flag).
  optional bool require_sinkhorn_supported = 5;
  // External placement, machine, or knob fact required by this body (e.g. "cpu_kernels", "layer_mailboxes") (unit: fact name).
  optional string require_external_fact = 6;
}

// KernelBody describes a registered kernel body implementation reported once for the build.
message KernelBody {
  // The operator this body implements (e.g. "vxpu::fp8_linear") (unit: operator name).
  string op = 1;
  // Implementation body name (e.g. "reference", "gpu-fp8-gemv", "cpu-kernel") (unit: body name).
  string name = 2;
  // Device types this implementation runs on (e.g. "cpu", "cuda") (unit: device string).
  repeated string devices = 3;
  // Numerics classification relative to reference ("bit-identical" or "rounding") (unit: classification).
  string numerics = 4;
  // Whether the implementation can be inlined into the graph by the lowering (unit: boolean flag).
  bool lowerable = 5;
  // Operator family execution kind (e.g. SITE_KIND_DENSE_GEMV, SITE_KIND_EXPERT_OP).
  SiteKind kind = 6;
  // Applicability condition under which this body applies.
  KernelCondition condition = 7;
  // Whether the body executes on the host regardless of accelerator device (unit: boolean flag).
  bool host = 8;
}

// KernelCatalog reports all kernel bodies available in the build.
message KernelCatalog {
  repeated KernelBody bodies = 1;
}

// KernelRecord records the physical kernel selections and byte footprints across call sites.
message KernelRecord {
  // Knobs in effect during planning.
  Knobs knobs = 1;
  // Execution device string (e.g. "cuda:0", "cpu") (unit: device string).
  string device = 2;
  // Compute capability of the GPU if running on CUDA (e.g. "9.0") (unit: capability version).
  optional string gpu_capability = 3;
  // Physical execution records per call site.
  repeated SiteRecord sites = 4;
}

// Package names a compiled package required by a segment.
message Package {
  // Name identifies the segment or role within the execution plan.
  string name = 1;
  // Key identifies the compiled package content digest.
  string key = 2;
}

// CompileFailure records a toolchain compilation failure for a package.
// It asserts that the toolchain for machine_kind under software_version failed
// to compile this package and emitted the recorded diagnostic reason. A reader
// (such as the planner) may conclude that compilation failed on this toolchain,
// though it may not tell from this entry alone whether the input was refused by
// the compiler or the compiler was killed by an environment error (such as out
// of memory).
message CompileFailure {
  // Package identifies the segment package that failed to compile.
  Package package = 1;
  // MachineKind identifies the target hardware platform.
  string machine_kind = 2;
  // SoftwareVersion identifies the executor and toolchain release.
  string software_version = 3;
  // Reason holds the diagnostic text emitted by the compiler toolchain.
  string reason = 4;
}

// BodyCompileOutcome records the last observed outcome of building a kernel body
// implementing an operator on a machine kind with a software version.
// It is a fact about an operator's body on a machine kind, holding across all models and packages.
message BodyCompileOutcome {
  // Op is the canonical vxpu operator name (e.g. "vxpu::fp8_linear").
  string op = 1;
  // Body names the kernel implementation body (e.g. "reference", "cpu_kernel").
  string body = 2;
  // MachineKind identifies the target hardware platform (e.g. "cpu:amd epyc 9b14:avx512", "gpu:nvidia l4").
  string machine_kind = 3;
  // SoftwareVersion identifies the compiler toolchain and executor release.
  string software_version = 4;
  // Compiled reports whether the body compiled successfully.
  bool compiled = 5;
  // Reason holds the diagnostic text emitted by the compiler toolchain when compilation failed.
  string reason = 6;
}

// PackageReport records which compiled packages a plan requires, and
// which exist in or are missing from the package store.
message PackageReport {
  // Required lists all compiled packages required by the plan.
  repeated Package required = 1;
  // Present lists required packages that exist in the package store.
  repeated Package present = 2;
  // Missing lists required packages that are missing from the package store.
  repeated Package missing = 3;
  // Failed lists packages that failed to compile on the target machine kind,
  // including packages recorded earlier as failing and therefore not asked for again.
  repeated CompileFailure failed = 4;
  // MachineKind identifies the target hardware platform for this report.
  string machine_kind = 5;
  // BodyOutcomes lists observed kernel body compilation outcomes for the target machine kind.
  repeated BodyCompileOutcome body_outcomes = 6;
}

// CallSite is an invocation of a vxpu custom operator within a segment of the execution graph.
// Its Node field records the graph node name, which serves as the plan's site identifier
// when joining operator choices and tuning knobs against graph operations.
message CallSite {
  // Op is the canonical name of the vxpu operator, read from the node target in the exported graph (e.g. "vxpu::fp8_linear").
  string op = 1;

  // Node is the name of the graph node that invokes the operator, read from the node name in the exported graph.
  string node = 2;

  // Site is the hierarchical module path of the layer owning this call site, read from the node's nn_module_stack metadata.
  string site = 3;

  // PlanSite records the physical operator choice for this call site from the execution plan.
  optional PlanSite plan_site = 4;

  // Stats records execution measurements for this call site from a run record.
  optional SiteExecutionStats stats = 5;

  // Shapes records the tensor dimensions and parameters at this call site, read from
  // tensor shapes in manifest.json and node input arguments in the exported graph.
  string shapes = 7;

  // Rows is the candidate query row count planned for this call site, provided via the --rows flag.
  int32 rows = 8;

  // Dtype is the input tensor data type at this call site, read from tensor metadata in manifest.json.
  string dtype = 9;

  // SinkhornSupported reports whether this site's hyper-connection multiplier is supported by Triton, read from the node's hc_mult argument in the exported graph (Triton hc_split_sinkhorn requires power-of-two width for register block tiling).
  bool sinkhorn_supported = 10;

  // RowCounts lists all candidate query row counts planned for this call site, provided via the --rows flag.
  repeated int32 row_counts = 11;

  // Body is the physical kernel implementation body chosen to execute at this call site, selected by the planner from the catalog and table.
  // Left empty when the catalog has no registered body for this op (such as hc_front, ffn_front, or sparse_attn); the engine executes its default runtime implementation.
  string body = 12;

  // ExecutedBodies lists the operator implementation bodies reported by the run record for this call site.
  repeated ExecutedBody executed_bodies = 13;

  // InRecord reports whether this call site was present in the run record.
  optional bool in_record = 14;

  // Measured reports whether this call site was measured during the run.
  bool measured = 15;
}

// SegmentRun specifies how a segment of the execution graph runs.
//
// The planner decides each segment's run mode for the machine the plan targets;
// the executor builds each segment's callable from that value and nothing else.
// Today the executor reads switches in Python instead (VXPU_SEGMENT_RUNTIME,
// VXPU_SEGMENT_GRAPH, and VXPU_SPLIT_COMPILE in vxpu/python/vxpu/plan.py),
// which a later move replaces once the plan is carried on load.
enum SegmentRun {
  // SEGMENT_RUN_UNSPECIFIED indicates an unset execution mode. A reader refuses this value.
  SEGMENT_RUN_UNSPECIFIED = 0;

  // SEGMENT_RUN_PLAIN_TORCH executes the segment directly in PyTorch without compilation.
  // The executor calls the segment callable directly as plain torch. Host segments always
  // have this value because host operations execute eagerly. Pass-through models (such as
  // tiny Llama) have this value on every segment.
  SEGMENT_RUN_PLAIN_TORCH = 1;

  // SEGMENT_RUN_JIT compiles the segment just-in-time at load using torch.compile.
  // This is what the engine on main does by default when compiling dense segments
  // (compile_decode=True, VXPU_SEGMENT_RUNTIME="jit" in plan.py:651-674).
  SEGMENT_RUN_JIT = 2;

  // SEGMENT_RUN_PACKAGE executes the segment from an ahead-of-time compiled package
  // called directly without CUDA graph capture. Dense segments run with this value
  // when ahead-of-time compilation is selected on CPU targets (VXPU_SEGMENT_RUNTIME="aoti").
  SEGMENT_RUN_PACKAGE = 3;

  // SEGMENT_RUN_CAPTURED executes the segment from an ahead-of-time compiled package
  // captured into a per-segment CUDA graph. Dense segments run with this value when
  // ahead-of-time compilation is selected on GPU targets (such as NVIDIA L4,
  // VXPU_SEGMENT_RUNTIME="aoti" and VXPU_SEGMENT_GRAPH=True).
  SEGMENT_RUN_CAPTURED = 4;
}

// ValueKind classifies a value read or written by a segment according to its lifecycle.
enum ValueKind {
  // Unspecified value kind; a reader refuses this value.
  VALUE_KIND_UNSPECIFIED = 0;

  // Step inputs (such as input_ids and cache_position) provided anew for each decode step.
  // A reader may rely on these values not outliving the step.
  VALUE_KIND_STEP_INPUT = 1;

  // Resident values (weights, KV caches, scratch buffers, and constants) that live across steps.
  // A reader may rely on these values outliving the step.
  VALUE_KIND_RESIDENT = 2;

  // Intermediate values passed between segments within a single step.
  // Produced by an earlier segment and consumed by a later segment.
  // A reader may rely on these values not outliving the step.
  VALUE_KIND_INTERMEDIATE = 3;

  // Step outputs (such as logits) produced by the last segment and returned to the caller.
  // A reader may rely on these values not outliving the step.
  VALUE_KIND_STEP_OUTPUT = 4;
}

// Value represents a single named tensor or argument value read or written by a segment.
message Value {
  // Name is the tensor identifier inside the segment's graph (such as a placeholder name
  // for a pre-step read or a node output name for a write or same-step read). A reader may
  // rely on Name matching the tensor identifier in the exported graph. For operations that
  // return multiple outputs (such as a tuple), each output value is named by its individual
  // unpacked tensor identifier (for example "getitem_0") rather than the parent operation
  // node name.
  string name = 1;

  // Kind classifies the value by its lifecycle (step input, resident value, intermediate value,
  // or step output). A reader may rely on Kind to determine whether the value outlives a step.
  ValueKind kind = 2;

  // Resident is the persistent slot name (such as a parameter, buffer, or constant FQN like
  // "model.layers.0.cache") when Kind is VALUE_KIND_RESIDENT, and is empty otherwise.
  // Every resident value, whether read or written, carries the same Resident string so an
  // executor matches reads and in-place updates to the same persistent slot while using Name
  // to bind the tensor inside each segment.
  //
  // For an in-place buffer update, the writing segment records {name: <output>, kind:
  // VALUE_KIND_RESIDENT, resident: <slot>}. A later segment in the same step that reads
  // <output> also carries kind VALUE_KIND_RESIDENT and the same Resident string, and observes
  // the new state produced by the writing segment. A later segment in the same step that reads
  // the original input placeholder carries kind VALUE_KIND_RESIDENT with the placeholder Name
  // and the same Resident string, and observes the start-of-step state. At the end of the step,
  // the executor commits <output> into the persistent slot named by Resident so subsequent
  // steps observe the new state.
  string resident = 3;
}

// Segment is a partition of the model's exported execution graph divided at host operations.
//
// Host ops cut the node sequence, taken in archive serialization order, into runs.
// Run i of ordinary nodes is segment 2i (run 0 precedes the first host op, and the run
// following the last host op is the final run). Host op i is segment 2i+1. An empty run
// has no segment, so an even number can be missing. Each segment is named "submod_<index>"
// after its index, matching what the Python split (split_at_host_ops) produces until #748
// removes it. The same cutting rule applies across nested graphs (subgraphs inside higher-order
// operations), traversed in serialization order: a host op inside a nested graph forms its own
// host segment, while ordinary nodes and call sites are placed into runs between host ops.
message Segment {
  // Name is the identifier of the segment within the partitioned graph, such as "submod_0".
  string name = 1;

  // Host reports whether the segment is one host operation rather than a run of ordinary nodes.
  bool host = 2;

  // CallSites is the ordered list of custom operator call sites located within this segment.
  repeated CallSite call_sites = 3;

  // TotalMeasuredTimeUs is the sum of measured execution time across call sites in this segment, in microseconds.
  optional double total_measured_time_us = 4;

  // Run describes how the segment executes (plain PyTorch, JIT compiled, an ahead-of-time compiled package, or captured into a CUDA graph).
  // The planner decides it for the target machine; the executor builds each segment's callable from this value.
  // A host segment always has the value SEGMENT_RUN_PLAIN_TORCH.
  SegmentRun run = 5;

  // Reads lists the values this segment reads from outside itself.
  // Every value read is a step input, a resident value, or a value written by an earlier segment.
  // For VALUE_KIND_RESIDENT reads, Resident names the persistent slot and Name identifies the
  // tensor inside this segment (either the pre-step input placeholder or an earlier segment's
  // updated output tensor). A reader may rely on Reads being ordered in argument consumption order.
  repeated Value reads = 6;

  // Writes lists the values this segment produces that are read by later segments,
  // update resident state, or constitute the step's outputs.
  // For VALUE_KIND_RESIDENT writes, Name identifies the segment output tensor carrying the new
  // value and Resident names the persistent slot it replaces. A later segment in the same step
  // reading Name sees the new state, while a later segment reading the pre-step placeholder sees
  // the start-of-step state. At the end of the step, the executor commits Name into Resident so
  // subsequent steps observe the new state.
  // A reader may rely on Writes being ordered in graph execution order.
  repeated Value writes = 7;
}

// PlanKnob records one configured tuning knob and whether it is compiled into packages.
message PlanKnob {
  // Name is the identifier of the tuning knob.
  string name = 1;

  // Value is the string representation of the knob's setting.
  string value = 2;

  // CompiledIn reports whether the knob is compiled into operator packages.
  bool compiled_in = 3;
}

// SlowestCallSite records one of the slowest call sites in the model.
// The list selects the top five call sites ordered descending by measured execution time in microseconds,
// breaking ties by node identifier in ascending alphabetical order.
message SlowestCallSite {
  // Rank is the 1-based order of this call site among the slowest sites, from 1 to 5.
  int32 rank = 1;

  // Node is the graph node identifier of the call site.
  string node = 2;

  // Op is the canonical operator name at the call site.
  string op = 3;

  // Segment is the name of the segment containing this call site.
  string segment = 4;

  // MeasuredTimeUs is the execution time of the call site in microseconds.
  double measured_time_us = 5;

  // Percent is the percentage of total measured call site time consumed by this site.
  double percent = 6;
}

// ModelTree records a model's structure as a tree of segments and call sites,
// and the execution choices and measurements when a plan or run record is attached.
message ModelTree {
  // Model is the name or identifier of the model at the root of the tree.
  string model = 1;

  // Segments lists the model's segments in decode execution order.
  repeated Segment segments = 2;

  // PlannedCallSites is the count of call sites assigned an operator body in the plan.
  int32 planned_call_sites = 3;

  // Knobs lists the configured tuning knobs in effect for the plan.
  repeated PlanKnob knobs = 4;

  // ArtifactMd5 is the checksum over manifest.json and binding.json of the plan.
  string artifact_md5 = 5;

  // TreeCommit is the git commit hash of the tree used to build the plan.
  string tree_commit = 6;

  // UnmatchedPlanSites lists planned sites that did not match any call site in the graph.
  repeated PlanSite unmatched_plan_sites = 7;

  // Stats records execution measurements reported by the executor from a real run.
  optional PlanExecutionStats stats = 8;

  // TotalMeasuredTimeUs is the sum of measured execution time across all call sites in the model, in microseconds.
  optional double total_measured_time_us = 9;

  // MeasuredCallSites is the count of call sites that have a recorded execution measurement.
  int32 measured_call_sites = 10;

  // UnmatchedMeasurements lists recorded execution measurements that did not match any call site in the graph.
  repeated PlanSite unmatched_measurements = 11;

  // SlowestCallSites lists the top five call sites with the highest measured execution time,
  // ordered descending by measured time in microseconds, breaking ties by node identifier in ascending alphabetical order.
  repeated SlowestCallSite slowest_call_sites = 12;

  // TotalCallSites is the total count of custom operator call sites across all segments in the model.
  int32 total_call_sites = 13;

  // HasPlan reports whether physical execution plan choices are attached to the tree.
  bool has_plan = 14;

  // HasMeasurements reports whether execution measurements are attached to the tree.
  bool has_measurements = 15;

  // DifferingCallSites is the count of call sites where the executed bodies reported by the run record differ from the body chosen in the execution plan.
  // A call site differs when it was measured and did not run with empty executed bodies, when more than one body ran across invocations, or when the single body that ran does not match the planned body.
  // Unmeasured call sites with measured set to false and empty executed bodies are excluded from this count.
  int32 differing_call_sites = 16;

  // UnmeasuredCallSites is the count of call sites present in the run record that were not measured during the run.
  int32 unmeasured_call_sites = 17;
}

