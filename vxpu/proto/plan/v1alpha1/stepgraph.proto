syntax = "proto3";

package vxpu.plan.v1alpha1;

option go_package = "github.com/gke-labs/generation-ai/vxpu/pkg/api/plan/v1alpha1;v1alpha1";

// StepGraphDescription records the decode step graph: nodes in call order,
// step inputs, and step outputs.
message StepGraphDescription {
  // Segment nodes of the step graph in execution call order.
  repeated StepNode nodes = 1;
  // Names of the step input placeholders.
  repeated string inputs = 2;
  // References for the step outputs.
  repeated ValueRef outputs = 3;
  // Host mappings available to the step, and whether each is file-backed.
  repeated HostMapping host_mappings = 4;
}

// HostMapping describes a host tensor mapping outside the graph.
message HostMapping {
  // Name or identifier of the host mapping.
  string name = 1;
  // Whether this tensor is backed by a file mapping on the host.
  bool file_backed = 2;
}

// StepNode describes one segment of the decode step.
message StepNode {
  // Name of the segment node in the split module.
  string name = 1;
  // Label of the model layer for human inspection and per-class timings (e.g. "dense", "experts", "engram").
  string kind = 2;
  // Decoder layer indices covered by this node.
  repeated int32 layers = 3;
  // Arguments read by the node, flattened in argument order (constant arguments omitted).
  repeated ValueRef reads = 4;
  // Resident tensor names written in place by this node.
  repeated string writes = 5;
  // Target for nodes answered through an exchange with the CPU.
  HostCall host = 6;
  // How the node executes: inside the graph on the GPU, or through an exchange outside it.
  Execution execution = 7;
  // Who answers this node when execution is EXECUTION_EXCHANGE.
  Answer answer = 8;
}

// Answer identifies who answers an exchange node outside the graph.
enum Answer {
  // Unspecified handler; graph nodes leave this unspecified.
  ANSWER_UNSPECIFIED = 0;
  // Answered by the CPU in this process, including partial placements where the CPU computes remaining items.
  ANSWER_CPU = 1;
  // Wholly answered by a GPU pool on this GPU.
  ANSWER_GPU_POOL = 2;
  // Wholly answered by peer GPUs on this machine.
  ANSWER_PEER_GPU = 3;
  // Answered by a remote node server over the network.
  ANSWER_REMOTE = 4;
}

// Execution identifies how a node executes.
enum Execution {
  // Unspecified execution; a reader refuses this value.
  EXECUTION_UNSPECIFIED = 0;
  // Node runs inside the captured graph on the GPU as a compiled segment.
  EXECUTION_GRAPH = 1;
  // Node is answered through an exchange with something outside the graph.
  EXECUTION_EXCHANGE = 2;
}

// HostCall identifies the host operation answered by the CPU.
message HostCall {
  // External collection name answered by the CPU (e.g. "experts", "engram").
  string collection = 1;
  // Index of the op within the collection (0 is a real index, omitted by default in JSON).
  int32 index = 2;
}

// EdgeRef references an output of an earlier segment node.
message EdgeRef {
  // Producer segment node name.
  string node = 1;
  // Zero-based output index, omitted when the node produces a single output.
  optional int32 index = 2;
}

// ValueRef references a step input, a resident tensor, or an edge from an earlier node.
message ValueRef {
  oneof ref {
    // Name of the step input placeholder.
    string input = 1;
    // Name of the resident tensor attribute.
    string resident = 2;
    // Edge from an earlier node in the step graph.
    EdgeRef edge = 3;
    // Name of a host mapping read by this node.
    string host_mapping = 4;
  }
}

// Stream identifies the execution stream assigned to a node.
enum Stream {
  // Unspecified stream; a reader refuses this value.
  STREAM_UNSPECIFIED = 0;
  // Main execution stream for sequential nodes and exchange nodes.
  STREAM_MAIN = 1;
  // Second stream for concurrent execution of graph nodes.
  STREAM_PARALLEL = 2;
}

// StepPlan records the execution plan and stream assignment for a decode step.
// In database terms, an unexecuted step plan is the EXPLAIN output: what the
// planner decided to do. Attaching stats turns it into EXPLAIN ANALYZE: the
// same plan with actual execution times beside each node.
message StepPlan {
  // Segment nodes of the step graph in call order with their stream and waits.
  repeated NodePlan nodes = 1;
  // File-backed host mappings to release from host memory once loaded or copied.
  repeated string release_host_mappings = 2;
  // Execution measurements recorded when the step plan is run.
  // Unset in an unexecuted plan.
  StepPlanExecutionStats stats = 3;
}

// HostMappingReleaseStats records resident bytes before and after releasing a host mapping.
message HostMappingReleaseStats {
  // Name of the released host mapping.
  string mapping = 1;
  // Resident bytes before releasing (unit: bytes). Unset when not measured.
  optional int64 bytes_before = 2;
  // Resident bytes after releasing (unit: bytes). Unset when not measured.
  optional int64 bytes_after = 3;
  // Non-zero OS error number if madvise failed. Unset on successful release.
  optional int32 errno = 4;
}

// StepPlanExecutionStats records execution measurements for a decode step plan from a real run.
message StepPlanExecutionStats {
  // Measurements for released host mappings.
  repeated HostMappingReleaseStats host_mappings = 1;
}

// NodeExecutionStats records measurements taken during real-world execution of a step node.
// In database terms, this is the EXPLAIN ANALYZE side of the step plan: the
// actual execution times attached to each node after a run.
message NodeExecutionStats {
  // Median device execution duration in milliseconds across recorded steps of a run (unit: milliseconds).
  optional double device_time_ms = 1;
  // Number of recorded step executions contributing to device_time_ms (unit: steps).
  optional int32 sample_count = 2;
}

// NodePlan records the stream assignment and wait dependencies for one segment node.
message NodePlan {
  // Name of the segment node in the step graph.
  string name = 1;
  // Execution stream assigned to this node.
  Stream stream = 2;
  // Earlier node names that this segment must wait on before executing, sorted alphabetically.
  repeated string waits = 3;
  // Measurements recorded from a real run.
  // Unset when not measured.
  NodeExecutionStats stats = 4;
}

// StepGraphBox records the bounding box of a node in the layout canvas.
message StepGraphBox {
  // X is the horizontal position of the box in pixels from the left margin.
  double x = 1;

  // Y is the vertical position of the box in pixels from the top margin.
  double y = 2;

  // Width is the horizontal dimension of the box in pixels.
  double width = 3;

  // Height is the vertical dimension of the box in pixels.
  double height = 4;
}

// StepGraphPoint records a two-dimensional coordinate point in pixels.
message StepGraphPoint {
  // X is the horizontal coordinate in pixels.
  double x = 1;

  // Y is the vertical coordinate in pixels.
  double y = 2;
}

// StepGraphNode records one segment node in the step graph visualization.
message StepGraphNode {
  // Name is the unique segment node identifier in the step graph.
  string name = 1;

  // Stream is the execution stream assigned to this node.
  Stream stream = 2;

  // Waits lists the names of earlier nodes that this node waits on before executing.
  repeated string waits = 3;

  // Kind is the layer kind label of the node (such as "experts" or "engram") when known.
  string kind = 4;

  // Execution indicates how the node executes (graph on GPU or exchange outside).
  Execution execution = 5;

  // Answer indicates who answers an exchange node outside the graph.
  Answer answer = 6;

  // Depth is the topological depth of this node in the wait dependency DAG (0 for root nodes).
  int32 depth = 7;

  // MeasuredTimeMs is the median device execution duration in milliseconds from stats.
  // Unset when not measured.
  optional double measured_time_ms = 8;

  // Box is the bounding box of this node in the layout canvas.
  StepGraphBox box = 9;
}

// StepGraphEdge records a wait dependency edge from an earlier producer node to a waiting consumer node.
message StepGraphEdge {
  // From is the producer node name that must finish before the consumer executes.
  string from = 1;

  // To is the consumer node name that waits on the producer.
  string to = 2;

  // CrossesCards reports whether this wait dependency crosses between accelerator cards,
  // connecting this GPU to a node answered by a peer GPU or remote node server.
  bool crosses_cards = 3;

  // CrossesStreams reports whether this wait dependency crosses between different execution streams.
  bool crosses_streams = 4;

  // Path is the SVG path string for drawing the routed edge.
  string path = 5;

  // Points lists the waypoints of the routed edge from source to target.
  repeated StepGraphPoint points = 6;
}

// StepGraphLayer records one horizontal tier of segment nodes at the same topological depth.
message StepGraphLayer {
  // Depth is the topological depth of this layer (0 for root nodes).
  int32 depth = 1;

  // NodeNames lists the segment node names executing at this depth.
  repeated string node_names = 2;

  // Y is the vertical position of this layer in pixels from the top margin.
  double y = 3;
}

// StepStreamGroup groups nodes assigned to a specific execution stream.
message StepStreamGroup {
  // Stream is the execution stream identifier.
  Stream stream = 1;

  // NodeNames lists the segment node names assigned to this stream in call order.
  repeated string node_names = 2;

  // X is the horizontal position of this stream's column in pixels.
  double x = 3;

  // Width is the horizontal dimension of this stream's column in pixels.
  double width = 4;
}

// UnmatchedWait records a wait dependency naming a node not present in the step plan.
message UnmatchedWait {
  // Node is the consumer node declaring the wait dependency.
  string node = 1;

  // Target is the referenced producer node name that is missing from the plan.
  string target = 2;
}

// StepPlanGraph records a decode step plan as a graph of nodes, streams, waits,
// and card crossings for visualization and analysis.
message StepPlanGraph {
  // Nodes lists all segment nodes in the step plan in execution call order.
  repeated StepGraphNode nodes = 1;

  // Layers lists the horizontal tiers of nodes ordered by increasing topological depth.
  repeated StepGraphLayer layers = 2;

  // Streams lists the execution streams and the nodes assigned to each.
  repeated StepStreamGroup streams = 3;

  // Edges lists all wait dependency edges between nodes in the plan.
  repeated StepGraphEdge edges = 4;

  // TotalWaits is the total number of wait dependencies declared across all nodes in the plan.
  int32 total_waits = 5;

  // TotalCrossings is the count of wait dependency edges that cross between accelerator cards.
  // Unset when no step graph description was provided to identify card crossings.
  optional int32 total_crossings = 6;

  // MeasuredNodes is the count of nodes that carry execution measurements.
  int32 measured_nodes = 7;

  // TotalMeasuredTimeMs is the sum of measured device execution time in milliseconds across all measured nodes.
  // Unset when no nodes have execution measurements.
  optional double total_measured_time_ms = 8;

  // UnmatchedWaits lists wait references that name nodes not present in the plan.
  repeated UnmatchedWait unmatched_waits = 9;

  // UnmatchedNodes lists nodes present in the graph description that do not appear in the step plan.
  repeated string unmatched_nodes = 10;

  // Width is the total width of the graph layout in pixels.
  double width = 11;

  // Height is the total height of the graph layout in pixels.
  double height = 12;

  // EdgeCrossings is the count of perpendicular crossings between different routed edges.
  // Collinear overlap along shared exit and entry stems at nodes is not counted.
  int32 edge_crossings = 13;
}

