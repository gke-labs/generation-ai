syntax = "proto3";

package vxpu.plan.v1alpha1;

option go_package = "github.com/gke-labs/generation-ai/vxpu/pkg/api/plan/v1alpha1;v1alpha1";

// StepGraphDescription records the decode step graph: nodes in call order,
// step inputs, and step outputs.
message StepGraphDescription {
  // Segment nodes of the step graph in execution call order.
  repeated StepNode nodes = 1;
  // Names of the step input placeholders.
  repeated string inputs = 2;
  // References for the step outputs.
  repeated ValueRef outputs = 3;
  // Host mappings available to the step, and whether each is file-backed.
  repeated HostMapping host_mappings = 4;
}

// HostMapping describes a host tensor mapping outside the graph.
message HostMapping {
  // Name or identifier of the host mapping.
  string name = 1;
  // Whether this tensor is backed by a file mapping on the host.
  bool file_backed = 2;
}

// StepNode describes one segment of the decode step.
message StepNode {
  // Name of the segment node in the split module.
  string name = 1;
  // Label of the model layer for human inspection and per-class timings (e.g. "dense", "experts", "engram").
  string kind = 2;
  // Decoder layer indices covered by this node.
  repeated int32 layers = 3;
  // Arguments read by the node, flattened in argument order (constant arguments omitted).
  repeated ValueRef reads = 4;
  // Resident tensor names written in place by this node.
  repeated string writes = 5;
  // Target for nodes answered through an exchange with the CPU.
  HostCall host = 6;
  // How the node executes: inside the graph on the GPU, or through an exchange outside it.
  Execution execution = 7;
  // Who answers this node when execution is EXECUTION_EXCHANGE.
  Answer answer = 8;
}

// Answer identifies who answers an exchange node outside the graph.
enum Answer {
  // Unspecified handler; graph nodes leave this unspecified.
  ANSWER_UNSPECIFIED = 0;
  // Answered by the CPU in this process, including partial placements where the CPU computes remaining items.
  ANSWER_CPU = 1;
  // Wholly answered by a GPU pool on this GPU.
  ANSWER_GPU_POOL = 2;
  // Wholly answered by peer GPUs on this machine.
  ANSWER_PEER_GPU = 3;
  // Answered by a remote node server over the network.
  ANSWER_REMOTE = 4;
}

// Execution identifies how a node executes.
enum Execution {
  // Unspecified execution; a reader refuses this value.
  EXECUTION_UNSPECIFIED = 0;
  // Node runs inside the captured graph on the GPU as a compiled segment.
  EXECUTION_GRAPH = 1;
  // Node is answered through an exchange with something outside the graph.
  EXECUTION_EXCHANGE = 2;
}

// HostCall identifies the host operation answered by the CPU.
message HostCall {
  // External collection name answered by the CPU (e.g. "experts", "engram").
  string collection = 1;
  // Index of the op within the collection (0 is a real index, omitted by default in JSON).
  int32 index = 2;
}

// EdgeRef references an output of an earlier segment node.
message EdgeRef {
  // Producer segment node name.
  string node = 1;
  // Zero-based output index, omitted when the node produces a single output.
  optional int32 index = 2;
}

// ValueRef references a step input, a resident tensor, or an edge from an earlier node.
message ValueRef {
  oneof ref {
    // Name of the step input placeholder.
    string input = 1;
    // Name of the resident tensor attribute.
    string resident = 2;
    // Edge from an earlier node in the step graph.
    EdgeRef edge = 3;
    // Name of a host mapping read by this node.
    string host_mapping = 4;
  }
}

// Stream identifies the execution stream assigned to a node.
enum Stream {
  // Unspecified stream; a reader refuses this value.
  STREAM_UNSPECIFIED = 0;
  // Main execution stream for sequential nodes and exchange nodes.
  STREAM_MAIN = 1;
  // Second stream for concurrent execution of graph nodes.
  STREAM_PARALLEL = 2;
}

// StepPlan records the execution plan and stream assignment for a decode step.
// In database terms, an unexecuted step plan is the EXPLAIN output: what the
// planner decided to do. Attaching stats turns it into EXPLAIN ANALYZE: the
// same plan with actual execution times beside each node.
message StepPlan {
  // Segment nodes of the step graph in call order with their stream and waits.
  repeated NodePlan nodes = 1;
  // File-backed host mappings to release from host memory once loaded or copied.
  repeated string release_host_mappings = 2;
  // Execution measurements recorded when the step plan is run.
  // Unset in an unexecuted plan.
  StepPlanExecutionStats stats = 3;
}

// HostMappingReleaseStats records resident bytes before and after releasing a host mapping.
message HostMappingReleaseStats {
  // Name of the released host mapping.
  string mapping = 1;
  // Resident bytes before releasing (unit: bytes). Unset when not measured.
  optional int64 bytes_before = 2;
  // Resident bytes after releasing (unit: bytes). Unset when not measured.
  optional int64 bytes_after = 3;
  // Non-zero OS error number if madvise failed. Unset on successful release.
  optional int32 errno = 4;
}

// StepPlanExecutionStats records execution measurements for a decode step plan from a real run.
message StepPlanExecutionStats {
  // Measurements for released host mappings.
  repeated HostMappingReleaseStats host_mappings = 1;
}

// NodeExecutionStats records measurements taken during real-world execution of a step node.
// In database terms, this is the EXPLAIN ANALYZE side of the step plan: the
// actual execution times attached to each node after a run.
message NodeExecutionStats {
  // Median device execution duration in milliseconds across recorded steps of a run (unit: milliseconds).
  optional double device_time_ms = 1;
  // Number of recorded step executions contributing to device_time_ms (unit: steps).
  optional int32 sample_count = 2;
}

// NodePlan records the stream assignment and wait dependencies for one segment node.
message NodePlan {
  // Name of the segment node in the step graph.
  string name = 1;
  // Execution stream assigned to this node.
  Stream stream = 2;
  // Earlier node names that this segment must wait on before executing, sorted alphabetically.
  repeated string waits = 3;
  // Measurements recorded from a real run.
  // Unset when not measured.
  NodeExecutionStats stats = 4;
}

