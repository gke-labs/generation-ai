syntax = "proto3";

package vxpu;

option go_package = "github.com/gke-labs/generation-ai/vxpu/pkg/api/v1alpha1;v1alpha1";

// Agent runs as root on every machine the coordinator uses (#384). It does
// the work that needs the machine itself: mounting weights disks (#407),
// starting and supervising the runtime processes (#657), and reporting
// what its machine is (#663).
service Agent {
  // MountWeights mounts a weights disk read-only, after the coordinator has
  // attached it under device_name. It then checks the disk against its
  // index: every file must be present at its size and, with verify, have
  // its sha256. The executor reads the files in place, with VXPU_BLOB_DIR
  // set to blob_dir. Calling it again for a mounted disk does nothing more.
  rpc MountWeights(MountWeightsRequest) returns (MountWeightsResponse);
  // UnmountWeights unmounts the disk. The coordinator calls it before it
  // detaches the disk.
  rpc UnmountWeights(UnmountWeightsRequest) returns (UnmountWeightsResponse);

  // StartProcess starts a process with typed settings.
  // Starting a process that is already running with matching settings returns
  // already_running: true; differing settings are refused.
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  // StopProcess stops a running process and removes it from the agent.
  rpc StopProcess(StopProcessRequest) returns (StopProcessResponse);
  // GetProcess returns the status of a process, including how it
  // ended (exit code or signal) and the tail of its output.
  rpc GetProcess(GetProcessRequest) returns (GetProcessResponse);
  // ListProcesses lists all processes currently tracked by the agent.
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);

  // StageBlobs makes the blobs named by their sha256 present on local disk,
  // fetching any missing blobs from the agent's configured store. It reports
  // each staged blob and its size.
  rpc StageBlobs(StageBlobsRequest) returns (StageBlobsResponse);
  // ListBlobs reports which blobs are currently staged on local disk with their sizes.
  rpc ListBlobs(ListBlobsRequest) returns (ListBlobsResponse);

  // DescribeMachine reports what this machine is: its processors and memory,
  // its cards, its local disks, and where it sits. The answer reflects what
  // the agent's process can actually use (in a pod, the pod's share).
  rpc DescribeMachine(DescribeMachineRequest) returns (Probe);
}

message MountWeightsRequest {
  // The device name the disk is attached under. The agent finds the disk
  // at /dev/disk/by-id/google-<device_name>.
  string device_name = 1;
  // If set, the agent reads every file and checks its sha256. This reads
  // the whole disk, so it's slow, but it also measures the disk's read
  // throughput.
  bool verify = 2;
}

message MountWeightsResponse {
  // Where the agent mounted the disk, and the disk's blob directory, which
  // holds one file per checkpoint file, named by its sha256.
  string mount_dir = 1;
  string blob_dir = 2;
  // The files the disk's index lists, by sha256, with their sizes.
  map<string, int64> files = 3;
  int64 total_bytes = 4;
  // How long mounting and checking took, and, with verify, how long reading
  // and hashing every file took. total_bytes / verify_seconds gives the
  // disk's read throughput on this machine.
  double mount_seconds = 5;
  double verify_seconds = 6;
}

message UnmountWeightsRequest {
  string device_name = 1;
}

message UnmountWeightsResponse {}

message StartProcessRequest {
  // Unique identifier for this process on the machine (e.g. "executor", "rank-0").
  string id = 1;
  // Which process to run (e.g. "executor", "nodeserver"). Must match a process configured on the agent.
  string process = 2;
  // GPU card index (e.g. 0, 1). If unset, no card is assigned.
  optional int32 card = 4;
  // Path to a plan file under the agent's work directory (for processes that accept plan files).
  string plan_file = 5;
  // Keep-alive duration in seconds for an idle model before eviction.
  optional int32 keep_alive_seconds = 6;
  // Reference to a model artifact in the store (as repository:tag) to stage for processes that accept artifacts.
  string artifact = 7;

  reserved 3;
  reserved "port";
}

message StartProcessResponse {
  // True if the process was already running when called.
  bool already_running = 1;
  ProcessStatus status = 2;
}

message StopProcessRequest {
  string id = 1;
}

message StopProcessResponse {}

message GetProcessRequest {
  string id = 1;
}

message GetProcessResponse {
  ProcessStatus status = 1;
}

message ListProcessesRequest {}

message ListProcessesResponse {
  repeated ProcessStatus processes = 1;
}

message StageBlobsRequest {
  // Names lists the sha256 content hashes of the blobs to stage.
  repeated string names = 1;
}

message StageBlobsResponse {
  // Blobs lists each staged blob with its size in bytes on local disk.
  repeated BlobInfo blobs = 1;
}

message ListBlobsRequest {}

message ListBlobsResponse {
  // Blobs lists each staged blob with its size in bytes on local disk.
  repeated BlobInfo blobs = 1;
}

message BlobInfo {
  // Name is the sha256 content hash of the blob.
  string name = 1;
  // Size is the size of the blob in bytes on local disk.
  int64 size = 2;
}

message ProcessStatus {
  // Identifier of the process.
  string id = 1;
  // Process ID of the process.
  int32 pid = 2;
  // Name of the process that was started.
  string process = 3;
  // Current state or outcome: "running", "stopping", "exited with code N", or "killed by signal N".
  string state = 4;
  // The last lines of output from the process (at most 64 KiB).
  string output = 5;
  // Exit code if the process exited normally.
  int32 exit_code = 6;
  // Signal number if the process was killed by a signal.
  int32 signal = 7;
  // Endpoint is the host and port the process was told to serve on, as reachable from the coordinator. Set by the agent.
  string endpoint = 8;
}

message DescribeMachineRequest {}

// Probe describes the hardware facts a machine or executor reports about itself.
message Probe {
  // Device is the accelerator device category ("cpu" or "cuda").
  string device = 1;
  // Cpu is the host processor model name, or empty if it could not be read.
  string cpu = 2;
  // CpuCores is the physical processor core count available to this process (in a pod, the pod's share).
  int32 cpu_cores = 3;
  // CpuThreads is the usable processor thread count available to this process (in a pod, the pod's share).
  int32 cpu_threads = 4;
  // Simd is the processor SIMD instruction capability ("avx512", "avx2", "neon", "sse", or "unknown").
  string simd = 5;
  // RamBytes is the usable system RAM in bytes available to this process (in a pod, the pod's share).
  int64 ram_bytes = 6;

  // Gpu is the accelerator card model name, or empty if no card is present or readable.
  string gpu = 7;
  // GpuMemoryBytes is the accelerator memory per card in bytes.
  int64 gpu_memory_bytes = 8;
  // GpuCount is the number of accelerator cards accessible to this process (in a pod, the pod's share).
  int32 gpu_count = 9;

  // StorageDevices is the count of local NVMe SSD storage devices directly attached to the machine (0 in a pod).
  int32 storage_devices = 10;
  // StorageBytes is the total raw local SSD capacity in bytes.
  int64 storage_bytes = 11;

  // Zone is the cloud placement zone (e.g. "us-central1-a"), or empty if unreachable.
  string zone = 12;
  // InstanceName is the instance or node name where the agent is running.
  string instance_name = 13;

  // Unread lists facts that could not be read, with the reason each was unavailable.
  repeated string unread = 14;
}

